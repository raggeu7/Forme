<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما أونلاين - أفلام ومسلسلات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #e11d48;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }

        input, select, button {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            outline: none;
        }

        input {
            flex: 1;
        }

        button {
            background-color: var(--accent-color);
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #be123c;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Video Player Section */
        .player-wrapper {
            display: none;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .iframe-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            background-color: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .player-controls {
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            background-color: #1a2332;
        }

        .series-controls {
            display: none;
            gap: 10px;
        }

        /* Grid Section */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info {
            padding: 0.8rem;
        }

        .card-title {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-type {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .section-title {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="loadTrending()">سينما أونلاين</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="searchMedia()">بحث</button>
        </div>
    </header>

    <div class="container">
        <div class="player-wrapper" id="playerSection">
            <div class="iframe-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div class="player-controls">
                <h3 id="currentTitle" style="flex: 1;">اسم العرض</h3>
                
                <select id="serverSelect" onchange="updatePlayer()">
                    <option value="vidsrc">سيرفر تلقائي 1 (Vidsrc)</option>
                    <option value="autoembed">سيرفر تلقائي 2 (AutoEmbed)</option>
                    <option value="smashystream">سيرفر تلقائي 3 (Smashy)</option>
                </select>

                <div class="series-controls" id="seriesControls">
                    <label>الموسم: 
                        <input type="number" id="seasonNum" value="1" min="1" style="width: 60px;" onchange="updatePlayer()">
                    </label>
                    <label>الحلقة: 
                        <input type="number" id="episodeNum" value="1" min="1" style="width: 60px;" onchange="updatePlayer()">
                    </label>
                </div>
            </div>
        </div>

        <h2 class="section-title" id="gridTitle">الأكثر تداولاً اليوم</h2>
        <div class="grid" id="mediaGrid"></div>
    </div>

    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084dd27548780'; // مفتاح TMDB مجاني للعرض
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentMedia = null; // يحفظ بيانات العنصر المشغل حالياً

        // جلب المحتوى الأكثر تداولاً عند فتح الموقع
        window.onload = () => {
            loadTrending();
            
            // تفعيل البحث عند الضغط على Enter
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchMedia();
            });
        };

        async function loadTrending() {
            document.getElementById('gridTitle').innerText = 'الأكثر تداولاً اليوم';
            const res = await fetch(`${BASE_URL}/trending/all/day?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            displayResults(data.results);
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
            const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}`);
            const data = await res.json();
            displayResults(data.results);
        }

        function displayResults(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                if (item.media_type !== 'movie' && item.media_type !== 'tv') return;
                if (!item.poster_path) return;

                const card = document.createElement('div');
                card.className = 'card';
                
                const title = item.title || item.name;
                const type = item.media_type === 'movie' ? 'فيلم' : 'مسلسل';

                card.innerHTML = `
                    <img src="${IMG_URL + item.poster_path}" alt="${title}">
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-type">${type}</div>
                    </div>
                `;

                card.onclick = () => selectMedia(item);
                grid.appendChild(card);
            });
        }

        function selectMedia(item) {
            currentMedia = item;
            document.getElementById('playerSection').style.display = 'block';
            document.getElementById('currentTitle').innerText = item.title || item.name;
            
            // إظهار/إخفاء أدوات المسلسلات
            const seriesControls = document.getElementById('seriesControls');
            if (item.media_type === 'tv') {
                seriesControls.style.display = 'flex';
            } else {
                seriesControls.style.display = 'none';
            }

            // التمرير لأعلى لمشاهدة المشغل
            window.scrollTo({ top: 0, behavior: 'smooth' });

            updatePlayer();
        }

        function updatePlayer() {
            if (!currentMedia) return;

            const server = document.getElementById('serverSelect').value;
            const id = currentMedia.id;
            const type = currentMedia.media_type;
            const season = document.getElementById('seasonNum').value || 1;
            const episode = document.getElementById('episodeNum').value || 1;

            let embedUrl = '';

            // بناء الرابط التلقائي بناءً على السيرفر المختار
            if (server === 'vidsrc') {
                embedUrl = type === 'movie' 
                    ? `https://vidsrc.to/embed/movie/${id}`
                    : `https://vidsrc.to/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 'autoembed') {
                embedUrl = type === 'movie' 
                    ? `https://player.autoembed.cc/embed/movie/${id}`
                    : `https://player.autoembed.cc/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 'smashystream') {
                embedUrl = type === 'movie' 
                    ? `https://embed.smashystream.com/playere.php?tmdb=${id}`
                    : `https://embed.smashystream.com/playere.php?tmdb=${id}&season=${season}&episode=${episode}`;
            }

            document.getElementById('videoPlayer').src = embedUrl;
        }
    </script>
</body>
</html>
